name: Blume cookbook preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'examples/serving/**'
      - '.github/workflows/ci-docs-site.yml'
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'examples/serving/**'
      - '.github/workflows/ci-docs-site.yml'

permissions:
  contents: read

concurrency:
  group: blume-cookbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            docs-site/package-lock.json
      - name: Install cookbook and site dependencies
        run: |
          npm ci --prefix docs
          npm ci --prefix docs-site
      - name: Check formatting and types
        run: |
          npm run format:check --prefix docs-site
          npm run check --prefix docs-site
      - name: Test shared configuration API
        run: npm run test:cookbook --prefix docs
      - name: Build and validate preview
        run: |
          npm run build --prefix docs-site
          npm run validate --prefix docs-site
      - name: Install browser
        working-directory: docs-site
        run: npx playwright install --with-deps chromium
      - name: Test cookbook interactions
        run: npm test --prefix docs-site
      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: fastvideo-blume-preview
          path: docs-site/dist
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blume-browser-results
          path: docs-site/test-results
          if-no-files-found: ignore
