name: Close Stale Issues and PRs

on:
  schedule:
    # Daily at 1:30 AM UTC
    - cron: '30 1 * * *'

jobs:
  stale:
    if: github.repository == 'hao-ai-lab/FastVideo'
    permissions:
      issues: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@997185467fa4f803885201cee163a9f38240193d # v10.1.1
        with:
          operations-per-run: 500

          exempt-draft-pr: true
          exempt-issue-labels: 'keep-open,pinned,security,Bug,RFC'
          exempt-pr-labels: 'keep-open,pinned'

          labels-to-add-when-unstale: 'unstale'
          labels-to-remove-when-stale: 'unstale'

          days-before-issue-stale: 90
          days-before-issue-close: 30
          stale-issue-label: 'stale'

          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-label: 'stale'
