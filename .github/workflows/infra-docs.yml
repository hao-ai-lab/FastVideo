name: Deploy Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'scripts/inference/**'
      - 'mkdocs.yml'
      - 'requirements-mkdocs.in'
      - 'requirements-mkdocs.txt'
      - 'requirements-cookbook.in'
      - 'requirements-cookbook.txt'
      # Configuration and serving definitions consumed by the cookbook exporter.
      - 'fastvideo/api/**'
      - 'fastvideo/configs/**'
      - 'fastvideo/registry.py'
      - 'fastvideo/fastvideo_args.py'
      - 'fastvideo/models/wan/*config.py'
      - 'fastvideo/models/wan/definition.py'
      - 'fastvideo/pipelines/basic/**/*.py'
      - 'fastvideo/entrypoints/**/*.py'
      - 'scripts/check_docs_links.py'
      - '.github/workflows/infra-docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'scripts/inference/**'
      - 'mkdocs.yml'
      - 'requirements-mkdocs.in'
      - 'requirements-mkdocs.txt'
      - 'requirements-cookbook.in'
      - 'requirements-cookbook.txt'
      # Configuration and serving definitions consumed by the cookbook exporter.
      - 'fastvideo/api/**'
      - 'fastvideo/configs/**'
      - 'fastvideo/registry.py'
      - 'fastvideo/fastvideo_args.py'
      - 'fastvideo/models/wan/*config.py'
      - 'fastvideo/models/wan/definition.py'
      - 'fastvideo/pipelines/basic/**/*.py'
      - 'fastvideo/entrypoints/**/*.py'
      - 'scripts/check_docs_links.py'
      - '.github/workflows/infra-docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  cookbook_metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install CPU metadata dependencies
        run: uv pip install --system -r requirements-cookbook.txt --torch-backend=cpu

      - name: Generate cookbook metadata
        run: python docs/cookbook_config.py

      - name: Upload cookbook metadata
        uses: actions/upload-artifact@v4
        with:
          name: cookbook-metadata
          path: docs/assets/cookbook-config/
          if-no-files-found: error

  build:
    needs: cookbook_metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -r requirements-mkdocs.txt

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Download from this workflow run so catalogs match the checked-out source.
      - name: Download cookbook metadata
        uses: actions/download-artifact@v4
        with:
          name: cookbook-metadata
          path: docs/assets/cookbook-config/

      - name: Build documentation
        run: mkdocs build

      - name: Check docs links
        run: python scripts/check_docs_links.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
