# Step 07 config — Stage 2 (robustness). 14B/720p, inits from the exported Stage-1 teacher, HEAD
# still FROZEN, sparse + heavy masking/dropout. Short finetune (lr 1e-6) -> the FINAL teacher.
#
# DATA: upstream uses a synthetic set here for controlled motion. You don't have synth generated,
# so this defaults to the SAME 720p openvid parquets + the stage-2 masking env (the robustness comes
# from the masking, applied on whatever data). Swap data_path to a synth set if you generate one
# (data_pipeline/gen_synth_worker.py). Masking knobs are set in 07_run_synth_stage2.sh, not here.
models:
  student:
    _target_: fastvideo.train.models.wantrack.wantrack.WanTrackModel
    init_from: /home/hal-kevin/models/openvid_stage1_14b_export   # from 06_export_stage1.sh
    trainable: true

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  model_path: /home/hal-kevin/models/openvid_stage1_14b_export

  distributed:
    num_gpus: 32
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 8   # across the 8 nodes
    hsdp_shard_dim: 4       # within each node

  data:
    data_path: /home/hal-shared/motionstream/data/openvid-wantrack-parquets   # swap to synth if available
    dataloader_num_workers: 2
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 31
    num_height: 720
    num_width: 1280
    num_frames: 121

  optimizer:
    learning_rate: 1.0e-6    # low LR, short robustness finetune
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 600             # upstream stage-2; ~1.5 days on 32 GPUs at global bs 128
    gradient_accumulation_steps: 4   # 1 x 32 GPU x 4 = global batch 128

  checkpoint:
    output_dir: /home/hal-kevin/data/motion-stream-test/synth_stage2_14b_720p_out
    training_state_checkpointing_steps: 100
    checkpoints_total_limit: 3
    resume_from_checkpoint: latest

  tracker:
    trackers: [wandb]
    project_name: wantrack-bidir
    run_name: synth-stage2-14b-720p-d64-bias
    entity: s4duan-uc-san-diego

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  track_validation:
    _target_: fastvideo.train.callbacks.track_validation.TrackValidationCallback
    every_steps: 300
    num_val_samples: 1
    val_sample_indices: [28]
    num_inference_steps: 20
    guidance_scale: 3.0
    motion_guidance_scale: 1.5
    fps: 24
    grid_stride: 3
    tail: 12
    include_heldout: false
    validate_at_start: false
    seed: 1000

pipeline:
  flow_shift: 6
