# Source-backed hardware inventory for cookbook lookup and capacity estimates.
#
# This is a specification catalog, not a runtime support matrix. Inclusion means
# the device/system is searchable; kernel, dtype, and model support are separate.
# memory.nominal is the vendor-stated capacity in its original unit. For unified
# systems it is shared system memory, never dedicated VRAM. memory.usable is an
# application budget derived by an explicit policy; omit it when no honest
# budget exists. The estimator uses a labeled 75% default for unified memory and
# lets callers override it. Sources carry the URL used and the date checked.
#
# Batch 1 prioritizes devices named by existing recipes, baselines, and the
# previous picker, then common consumer, workstation, and data-center variants.
# See hardware-coverage.md for the maintained checklist.
hardware:
  h100-sxm-80gb:
    name: NVIDIA H100 SXM 80 GB
    vendor: nvidia
    kind: gpu
    family: nvidia-h100
    variant: SXM 80 GB
    form_factor: sxm
    memory:
      type: dedicated
      nominal: { value: 80, unit: GB }
    backend: cuda
    partitionable: true
    partitions:
      - id: 1g.10gb
        label: 1g.10gb
        memory: { value: 10, unit: GB }
      - id: 2g.20gb
        label: 2g.20gb
        memory: { value: 20, unit: GB }
      - id: 3g.40gb
        label: 3g.40gb
        memory: { value: 40, unit: GB }
    supported_dtypes: [fp32, fp16, bf16, fp8]
    aliases: [h100]
    sources:
      - url: https://www.nvidia.com/en-us/data-center/h100/
        checked: 2026-10-19
    notes: H100 SXM; MIG profiles must be selected explicitly and never inherit the full 80 GB.

