title: FastH3 4-Step V1
summary: Four-step video and audio on one DGX Spark, with lazy module loading and offloaded encoders.
guide: docs/getting_started/installation/spark.md
deployments:
  spark-rest:
    label: DGX Spark REST
    runtime: fastvideo-cuda-rest
    workload: t2v
    defaults: examples/serving/openai_fasth3_spark.yaml
    env:
      FASTVIDEO_VSA_PTX_BLACKWELL: "0"
      FASTVIDEO_FA4: "0"
      FASTVIDEO_ATTENTION_BACKEND: VIDEO_SPARSE_ATTN_H3
    requirements:
      - Install FastVideo using the DGX Spark guide before running these commands.
      - GB10 has no FA4 or ptx_blackwell VSA kernel; the environment above selects the Triton path.
      - A 345-frame request on one Spark can run out of memory. Prefer 124 or 243 frames.
      - For two Sparks, use the inference recipe examples/inference/basic/basic_fasth3_spark_pair.yaml; it has no serving baseline yet.
    options:
      - server.*
      - generator.engine.num_gpus
      - generator.engine.parallelism.tp_size
      - generator.engine.parallelism.sp_size
      - generator.engine.offload.text_encoder
      - generator.engine.offload.vae
      - generator.pipeline.experimental.video_decode_backend
      - default_request.sampling.num_frames
      - default_request.sampling.height
      - default_request.sampling.width
      - default_request.sampling.seed
    overrides:
      default_request.sampling.num_frames:
        enum: [124, 243, 345]
        default: 124
        description: Native H3 frame counts. 345 frames can exceed one Spark's memory.
      default_request.sampling.height:
        minimum: 32
        multipleOf: 32
        default: 768
      default_request.sampling.width:
        minimum: 32
        multipleOf: 32
        default: 1344
