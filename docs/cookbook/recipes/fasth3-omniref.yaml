title: FastH3 Omni v1
summary: Video and synchronized audio from a prompt plus ordered image, video, and audio references, in eight forwards.
guide: docs/inference/fasth3_omniref.md
deployments:
  cuda-rest:
    runtime: fastvideo-cuda-rest
    workload: i2v
    defaults: examples/serving/openai_fasth3_omniref_rtx5090.yaml
    env: &omniref_env
      FASTVIDEO_ATTENTION_BACKEND: VIDEO_SPARSE_ATTN_H3
      FASTVIDEO_H3_VSA_FP4: "1"
      FASTVIDEO_H3_VSA_FP4_PREFIX: fp8
      FASTVIDEO_H3_VSA_FP4_TWO_LEVEL_P: "1"
      FASTVIDEO_H3_VSA_FP4_K_SMOOTH: "1"
      FASTVIDEO_H3_GATE_CHUNK_ROWS: "8192"
      FASTVIDEO_ULYSSES_A2A: auto
      FASTVIDEO_MINIMAX_H3_EXACT_KERNELS: all
      FASTVIDEO_H3_VSA_HEADS_FIRST_TILE: "1"
      FASTVIDEO_H3_VAE_TILE_PARALLEL: "1"
      FASTVIDEO_H3_REF2VA_MEMO_ENTRIES: "16"
      FASTVIDEO_MINIMAX_H3_FUSIONS: all
      FASTVIDEO_VSA_TRITON: "1"
      FASTVIDEO_VSA_PTX_BLACKWELL: "0"
      FASTVIDEO_FA4: "0"
      FASTVIDEO_H3_ADALN_TABLE: ./adaln_table.pt
      FASTVIDEO_H3_VAE_TILE_BATCH: "4"
    requirements: &omniref_requirements
      - 'UV_TORCH_BACKEND=cu130 uv pip install -e ".[fasth3]"'
      - >-
        Compose the model directory once: python examples/inference/basic/basic_fasth3_omniref_pdd.py
        --model-path FastVideo/FastH3-OmniRef-NVFP4-QAD --composed-dir ./FastH3-OmniRef-Composed
        --image assets/images/couple.jpg --prompt "a person speaking to camera"
      - >-
        The 32 GB card needs ./adaln_table.pt. Write it once with FASTVIDEO_H3_ADALN_DUMP=./adaln_table.pt
        on a run that loads the AdaLN projections, such as the RTX PRO 6000 or DGX Spark profile.
      - The 32 GB RTX 5090 keeps the text encoder off the GPU and loads denoise modules on demand; the DiT stays whole at 480p.
      - Requests carry ordered image_reference, video_reference, and audio references; list local media
        directories in server.media_roots.
      - Based on the maintained inference recipe; this serving adaptation has not been GPU-validated.
      - "Optional NVFP4 decoder (Blackwell only): hf download FastVideo/FastH3-NVFP4-VAE-Decoder --include 'quality-36L/decoder-nvfp4.safetensors' 'fast-8L/decoder-nvfp4.safetensors' --local-dir fasth3-nvfp4-vae"
    options: &omniref_options
      - server.*
      - generator.engine.offload.text_encoder
      - generator.pipeline.experimental.h3_vae_nvfp4_decoder
      - generator.pipeline.components.text_encoder_weights
      - default_request.sampling.num_frames
      - default_request.sampling.height
      - default_request.sampling.width
      - default_request.sampling.seed
    overrides: &omniref_overrides
      generator.pipeline.experimental.h3_vae_nvfp4_decoder:
        description: >-
          Replaces the video decoder with an NVFP4 decoder on Blackwell GPUs. quality-36L (about 1.4 GiB) gives the
          best-quality clip; fast-8L (0.31 GiB) suits memory-bound devices.
      default_request.sampling.num_frames:
        enum: [124, 243, 362]
        default: 124
        description: Five, ten, or fifteen seconds at 24 fps.
      default_request.sampling.height:
        minimum: 32
        multipleOf: 32
        default: 480
      default_request.sampling.width:
        minimum: 32
        multipleOf: 32
        default: 832
