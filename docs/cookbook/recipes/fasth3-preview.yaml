title: FastH3 Preview V0.2
summary: Few-step video and audio from the FastH3 preview checkpoint on CUDA or native Apple Silicon MLX.

deployments:
  cuda-rest:
    runtime: fastvideo-cuda-rest
    guide: docs/cookbook/openai-api.md
    workload: t2v
    defaults: examples/serving/openai_fasth3.yaml
    requirements:
      - 'UV_TORCH_BACKEND=cu130 uv pip install -e ".[fasth3]"'
      - "Optional NVFP4 decoder (Blackwell only): hf download FastVideo/FastH3-NVFP4-VAE-Decoder --include 'quality-36L/decoder-nvfp4.safetensors' 'fast-8L/decoder-nvfp4.safetensors' --local-dir fasth3-nvfp4-vae"
      - "Optional NVFP4 text encoder (Blackwell only): hf download FastVideo/FastVideo-FastH3-8-Step-V2-NVFP4-Consumer --include 'text_encoder/*' --local-dir fasth3-nvfp4-encoder"
    options:
      - server.*
      - generator.engine.num_gpus
      - generator.engine.parallelism.tp_size
      - generator.engine.parallelism.sp_size
      - generator.engine.offload.text_encoder
      - generator.engine.offload.vae
      - generator.pipeline.experimental.video_decode_backend
      - generator.pipeline.experimental.h3_vae_nvfp4_decoder
      - generator.pipeline.components.text_encoder_weights
      - default_request.sampling.num_frames
      - default_request.sampling.height
      - default_request.sampling.width
      - default_request.sampling.seed
    overrides:
      default_request.sampling.num_frames:
        minimum: 108
        maximum: 362
        description: Configured frame counts align upward to the next 17n+5 value, up to 362.
      default_request.sampling.height:
        minimum: 32
        multipleOf: 32
        default: 768
        description: H3 canvas dimensions use multiples of 32; the runtime's canvas-area limit also applies.
      default_request.sampling.width:
        minimum: 32
        multipleOf: 32

  mlx-rest:
    runtime: fastvideo-mlx-rest
    guide: docs/cookbook/openai-api.md
    workload: t2v
    defaults: examples/serving/mlx_fasth3.yaml
    requirements:
      - 'uv pip install -e ".[mlx]"'
      - Download the preview checkpoint and convert its transformer to an MLX int6 export before starting the server.
      - Paths are relative to the directory where you launch the server.
    options:
      - server.*
      - generator.model_root
      - generator.mlx_checkpoint
      - generator.prompt_cache_dir
      - generator.vae_dtype
      - default_request.sampling.num_frames
      - default_request.sampling.height
      - default_request.sampling.width
      - default_request.sampling.seed
    overrides:
      generator.vae_dtype:
        title: VAE compute precision
        description: Precision used by the native MLX VAE; the serving baseline uses fp32.
