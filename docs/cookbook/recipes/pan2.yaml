title: PAN 2
summary: Text-to-video and first-frame image-to-video from the 29B PAN 2 mixture-of-transformers model.

deployments:
  cuda-rest:
    runtime: fastvideo-cuda-rest
    workload: t2v
    defaults: examples/serving/openai_pan2.yaml
    requirements:
      - >-
        Requests without a reference run text-to-video. Add image_reference or input_reference
        to condition on a first frame; the same server and pipeline handle both.
      - >-
        To use more than one GPU, set sp_size equal to num_gpus (Ulysses sequence parallelism).
        It must divide PAN 2's 32 attention heads, and each rank still holds the full DiT weights.
    options:
      - server.*
      - generator.engine.num_gpus
      - generator.engine.parallelism.*
      - "!generator.engine.parallelism.hsdp_*"
      - generator.engine.offload.text_encoder
      - generator.engine.offload.vae
      - default_request.sampling.num_frames
      - default_request.sampling.height
      - default_request.sampling.width
      - default_request.sampling.fps
    overrides:
      default_request.sampling.num_frames:
        default: 313
        description: num_frames - 1 must be a multiple of 4.
      default_request.sampling.height:
        default: 704
        minimum: 32
        multipleOf: 32
      default_request.sampling.width:
        default: 1248
        minimum: 32
        multipleOf: 32
