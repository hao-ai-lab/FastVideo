title: Wan2.2 I2V A14B
summary: Image-conditioned video generation with the Wan2.2 mixture-of-experts model.

deployments:
  cuda-rest:
    runtime: fastvideo-cuda-rest
    workload: i2v
    defaults: examples/serving/openai_wan22_i2v_a14b.yaml
    requirements:
      - >-
        Each request must supply its own first frame through image_reference or
        input_reference; the server does not define a default image.
    options:
      - server.*
      - generator.engine.num_gpus
      - generator.engine.parallelism.*
      - "!generator.engine.parallelism.hsdp_*"
      - generator.engine.offload.text_encoder
      - generator.engine.offload.vae
      - default_request.sampling.num_frames
      - default_request.sampling.height
      - default_request.sampling.width
      - default_request.sampling.fps
    overrides:
      default_request.sampling.height:
        minimum: 16
        multipleOf: 16
      default_request.sampling.width:
        minimum: 16
        multipleOf: 16
