id: fasth3-v2
label: FastH3 V2 · 8 forwards
model_id: FastVideo/FastVideo-FastH3-8-Step-V2
task: t2v
runtime: cuda
default_hardware: gb200
hardware: [gb200]
install: 'UV_TORCH_BACKEND=cu130 uv pip install -e ".[fasth3]"'

# Only differences from defaults.yaml. Singleton choices render as fixed values.
options:
  num_gpus:
    default: 4
    # The inherited path sets generator.engine.num_gpus; also_set copies that value
    # to the paths below, keeping sequence parallelism equal to the GPU count.
    also_set: [generator.engine.parallelism.sp_size]
    help: Sequence parallelism follows GPU count.
  vsa_sparsity:
    label: VSA sparsity
    type: number
    path: generator.pipeline.experimental.VSA_sparsity
    choices: [0.0, 0.5, 0.8, 0.9]
    default: 0.8
    help: The trained setting is 0.8; quality at other sparsity values is unvalidated.

# Cookbook-owned deployment settings, without request sampling defaults.
# The build never loads examples/serving YAML files.
# Model identity and the option values above are supplied by the shared resolver.
settings:
  generator:
    engine:
      use_fsdp_inference: false
      parallelism:
        tp_size: 1
      offload:
        dit: false
        dit_layerwise: false
        text_encoder: true
        image_encoder: true
        pin_cpu_memory: true
      compile:
        enabled: false
        vae_enabled: false
    pipeline:
      workload_type: t2v
      experimental:
        attention_backend: VIDEO_SPARSE_ATTN_H3
        VSA_tile_size: 64
        inference_torch_compile: false
        vae_parallel_decode: true
        vae_parallel_decode_strategy: gather
  server:
    output_dir: outputs/openai_fasth3_8step
    served_model_name: fasth3

# Fixed smoke-test body, separate from server settings and interactive controls.
# Nine sigma points produce eight forwards for this checkpoint.
example_request:
  prompt: A cinematic view of a futuristic city at sunset, smooth camera pan
  width: 1344
  height: 768
  num_frames: 124
  fps: 24
  num_inference_steps: 9
  guidance_scale: 1
  seed: 1000
  negative_prompt: ""
