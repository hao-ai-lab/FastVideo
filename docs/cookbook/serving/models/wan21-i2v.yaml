id: wan21-i2v
label: Wan2.1 I2V · 14B 480P
model_id: Wan-AI/Wan2.1-I2V-14B-480P-Diffusers
task: i2v
runtime: cuda
default_hardware: gb200
hardware: [gb200]
install: 'UV_TORCH_BACKEND=cu130 uv pip install -e ".[dev]"'
evidence: source-configured
notes: >-
  This recipe independently records the two-GPU Wan2.1 I2V serving settings.
  Supply a source image with each request. The GB200 selection has not been
  validated by a serving benchmark and is not a memory-capacity or performance
  guarantee.

options:
  num_gpus:
    choices: [2]
    default: 2
    # The inherited path sets generator.engine.num_gpus; also_set copies that value
    # to the paths below, keeping sequence parallelism equal to the GPU count.
    also_set: [generator.engine.parallelism.sp_size]
  num_inference_steps:
    default: 40
  num_frames:
    choices: [77]
    default: 77

# Cookbook-owned baseline; request images never become server defaults.
settings:
  generator:
    engine:
      parallelism:
        tp_size: 2
      offload:
        dit: true
        text_encoder: true
        image_encoder: true
        pin_cpu_memory: true
    pipeline:
      workload_type: i2v
      experimental:
        flow_shift: 3.0
  server:
    output_dir: outputs/openai_wan21_i2v_14b
    served_model_name: wan21-i2v-14b
  default_request:
    negative_prompt: >-
      Bright tones, overexposed, static, blurred details, subtitles, style,
      works, paintings, images, static, overall gray, worst quality, low
      quality, JPEG compression residue, ugly, incomplete, extra fingers,
      poorly drawn hands, poorly drawn faces, deformed, disfigured, misshapen
      limbs, fused fingers, still picture, messy background, three legs, many
      people in the background, walking backwards
    sampling:
      height: 480
      width: 832
      fps: 16
      guidance_scale: 5.0
    output:
      return_frames: false
