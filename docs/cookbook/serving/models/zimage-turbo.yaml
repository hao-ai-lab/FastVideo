id: zimage-turbo
label: Z-Image Turbo
model_id: Tongyi-MAI/Z-Image-Turbo
task: t2i
runtime: cuda
default_hardware: gb200
hardware: [gb200]
install: 'UV_TORCH_BACKEND=cu130 uv pip install -e ".[dev]"'

options:
  num_gpus:
    choices: [1]
    # The inherited path sets generator.engine.num_gpus; also_set copies that value
    # to the paths below, keeping sequence parallelism equal to the GPU count.
    also_set: [generator.engine.parallelism.sp_size]
    help: The native Z-Image pipeline requires sequence parallelism equal to one.

# Cookbook-owned deployment settings. The build does not import the quick-start script.
settings:
  generator:
    revision: f332072aa78be7aecdf3ee76d5c247082da564a6
    engine:
      use_fsdp_inference: false
      parallelism:
        tp_size: 1
    pipeline:
      workload_type: t2i
  server:
    output_dir: outputs/openai_zimage_turbo
    served_model_name: zimage-turbo

# Fixed smoke-test body, separate from server settings and interactive controls.
example_request:
  prompt: A watercolor painting of a capybara beside a quiet pond
  size: 1024x1024
  num_inference_steps: 8
  guidance_scale: 0
  seed: 42
  negative_prompt: ""
