# Read by distill_dmd.sh, which passes model_path, engine.num_gpus, engine.parallelism.hsdp_shard_dim,
# training.distillation.real_score_model_path, training.distillation.fake_score_model_path, training.data.data_path,
# training.checkpoint.output_dir, training.tracker.run_name, and training.validation.dataset_file on the command line.
engine:
  parallelism:
    tp_size: 1
    sp_size: 1
    hsdp_replicate_dim: 1
  precision:
    dit: fp32
pipeline:
  # components:
  #   transformer_weights: path/to/generator_ema.safetensors
  flow_shift: 5.0
  dmd_denoising_steps: [1000, 750, 500, 250]
training:
  data:
    dataloader_num_workers: 4
    num_height: 352
    num_width: 640
    num_frames: 81
    train_batch_size: 1
    num_latent_t: 21
    training_cfg_rate: 0.0
    seed: 1000
    train_sp_batch_size: 1
  optimizer:
    learning_rate: 3.0e-06
    betas: [0.9, 0.95]
    weight_decay: 0.0
    max_grad_norm: 1.0
  loop:
    max_train_steps: 5
    gradient_accumulation_steps: 1
  checkpoint:
    training_state_checkpointing_steps: 400
    weight_only_checkpointing_steps: 400
    checkpoints_total_limit: 3
  tracker:
    project_name: matrixgame2_sf
  validation:
    enabled: true
    sampling_steps: [4]
    guidance_scale: 6.0
    every_steps: 100
    log_visualization: true
    visualization_steps: 100
  distillation:
    min_timestep_ratio: 0.02
    max_timestep_ratio: 0.98
    real_score_guidance_scale: 3.0
    fake_score_learning_rate: 3.0e-07
    fake_score_betas: [0.9, 0.95]
    simulate_generator_forward: true
    warp_denoising_step: true
  ema:
    enabled: true
    decay: 0.99
    start_step: 200
  self_forcing:
    dfake_gen_update_ratio: 5
    num_frame_per_block: 3  # Frame generation block size for self-forcing
    independent_first_frame: false  # Whether to treat first frame independently
    same_step_across_blocks: true  # Whether to use same denoising step across all blocks
    last_step_only: false  # Whether to only use the last denoising step
    context_noise: 0  # Amount of noise to add during context caching (0 = no noise)
  model:
    enable_gradient_checkpointing_type: full
