# FastH3 42-block NVFP4 DiT on one RTX 5090 (sm_120), 832x480 4-step.
#
# Requires the packed ``transformer/nvfp4_weights.safetensors`` export next to
# the dense shards, and ``engine.quantization.layer_profile: h3_dit`` so the
# loader overlays those buffers instead of materializing the 32 GB GEMMs.
# Full decode uses the Comfy int8-convrot VAE when
# ``vae/minimax_h3_video_vae_int8_convrot.safetensors`` sits beside the dense
# shards. Live preview is ``video_decode_backend: taeh3`` on the serve config.
#
#   FASTVIDEO_ATTENTION_BACKEND=ATTN_QAT_INFER FASTVIDEO_VSA_SM100A=0 FASTVIDEO_FA4=0 \
#     FASTVIDEO_STAGE_LOGGING=1 \
#     fastvideo generate --config examples/inference/basic/basic_fasth3_5090_nvfp4.yaml
generator:
  model_path: /workspace/models/fasth3-42-live
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    quantization:
      transformer_quant: NVFP4
      layer_profile: h3_dit
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: true
      vae: true
      pin_cpu_memory: true
      lazy_module_load: true
    compile:
      enabled: false
      vae_enabled: false
  pipeline:
    experimental:
      attention_backend: ATTN_QAT_INFER
      h3_sequential_load: true
      inference_torch_compile: false
      vae_parallel_decode: false
request:
  prompt: >-
    A wide cinematic shot of an alpine meadow at sunrise, pale pink mountain
    peaks above a blue valley filled with thin morning mist.
  negative_prompt: ""
  sampling:
    seed: 2026
    height: 480
    width: 832
    num_frames: 124
    fps: 24
    num_inference_steps: 5
    guidance_scale: 1.0
    batch_cfg: false
  output:
    output_path: outputs/fasth3_5090_nvfp4/
    save_video: true
    return_frames: false
