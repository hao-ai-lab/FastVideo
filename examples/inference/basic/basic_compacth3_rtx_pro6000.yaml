# CompactH3 (42-block 20B NVFP4) on one RTX PRO 6000 Blackwell (sm_120, 96 GB).
# Packed ``transformer/nvfp4_weights.safetensors`` plus
# ``engine.quantization.layer_profile: h3_dit``. Full decode uses the Comfy
# int8-convrot VAE when ``vae/minimax_h3_video_vae_int8_convrot.safetensors``
# sits beside the dense VAE shards.
#
# Assemble ./CompactH3 first (see the MiniMax H3 cookbook CompactH3 recipe).
# 96 GB keeps the encoder, DiT, and VAE resident. request.sampling is an
# example: native 16:9 sizes include 832x480 and 1344x768. Legal H3 frame
# counts are 17n+5, max 362 (15.08 s).
#
#   FASTVIDEO_ATTENTION_BACKEND=ATTN_QAT_INFER FASTVIDEO_VSA_SM100A=0 FASTVIDEO_FA4=0 \
#     FLASHINFER_CUDA_ARCH_LIST=12.0a FASTVIDEO_STAGE_LOGGING=1 \
#     fastvideo generate --config examples/inference/basic/basic_compacth3_rtx_pro6000.yaml
generator:
  model_path: ./CompactH3
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    quantization:
      transformer_quant: NVFP4
      layer_profile: h3_dit
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: false
      vae: false
      pin_cpu_memory: true
      lazy_module_load: false
    compile:
      enabled: false
      vae_enabled: false
  pipeline:
    experimental:
      attention_backend: ATTN_QAT_INFER
      h3_sequential_load: false
      inference_torch_compile: false
      vae_parallel_decode: false
      video_decode_backend: h3-vae
request:
  prompt: >-
    A wide cinematic shot of an alpine meadow at sunrise, pale pink mountain
    peaks above a blue valley filled with thin morning mist.
  negative_prompt: ""
  sampling:
    seed: 2026
    height: 768
    width: 1344
    num_frames: 124
    fps: 24
    num_inference_steps: 5
    guidance_scale: 1.0
    batch_cfg: false
  output:
    output_path: outputs/compacth3_rtx_pro6000/
    save_video: true
    return_frames: false
