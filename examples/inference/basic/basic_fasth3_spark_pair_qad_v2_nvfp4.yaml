# Start Ray on both Sparks and source spark_pair_env.sh first; see spark_pair.md.
# FastH3-QAD-v2 eight-forward video+audio on two DGX Sparks over QSFP RoCE.
# Uses the published fast-8L NVFP4 decoder on both workers (FASTVIDEO_H3_VAE_NVFP4_DECODER) with parallel temporal chunks.
# Download the complete release checkpoint as described in
# docs/getting_started/installation/spark_performance.md.
#
# FP4 attention needs fastvideo-kernel built for 12.1a and eager DiT inference.
# A missing extension is an error. Set h3_vsa_fp4.enabled to false for BF16 VSA.
# FastH3-QAD-v2 retains its trained 64-token VSA layout. The protected FP4 attention
# settings below are an inference choice, not its linears-only QAD recipe.
# The NVFP4 encoder and lightweight VAE ship in the same repository.
#
# FASTVIDEO_H3_VSA_FP4=1 FASTVIDEO_MINIMAX_H3_FUSIONS=all FASTVIDEO_NVFP4_MM_BACKEND=cudnn FASTVIDEO_NVFP4_MM_ROW_SPLIT=table \
# FASTVIDEO_H3_VAE_TILE_BATCH=12 FASTVIDEO_H3_VAE_INT8_OVERLAY=0 \
# FASTVIDEO_VSA_TRITON=1 FASTVIDEO_VSA_PTX_BLACKWELL=0 FASTVIDEO_FA4=0 \
# FASTVIDEO_ATTENTION_BACKEND=VIDEO_SPARSE_ATTN_H3 FASTVIDEO_STAGE_LOGGING=1 \
# fastvideo generate --config examples/inference/basic/basic_fasth3_spark_pair_qad_v2_nvfp4.yaml
generator:
  model_path: FastVideo/FastH3-QAD-v2
  engine:
    num_gpus: 2
    execution_backend: ray
    use_fsdp_inference: false
    quantization:
      transformer_quant: NVFP4
      layer_profile: h3_dit_vsa
    parallelism:
      tp_size: 1
      sp_size: 2
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: false
      image_encoder: false
      vae: false
      pin_cpu_memory: false
      lazy_module_load: false
    compile:
      enabled: false
      vae_enabled: false  # Published NVFP4 decoder uses its fused eager inference path.
  pipeline:
    workload_type: t2v
    vae_tiling: true
    experimental:
      attention_backend: VIDEO_SPARSE_ATTN_H3
      h3_vsa_fp4:
        enabled: true
        prefix_precision: fp8
        two_level_p: true
        smooth_k: true
        sp_head_chunks: 7
        sp_pooled_key_mean: true
        sp_direct_keys: true
        sp_projection_overlap: true
        sp_input_gather: true
      VSA_sparsity: 0.8
      VSA_tile_size: 64
      h3_sequential_load: false
      inference_torch_compile: false
      vae_parallel_decode: true
      vae_parallel_decode_strategy: gather
      video_decode_backend: h3-vae
request:
  prompt: A quiet pottery studio with a potter finishing a bowl at the wheel.
  negative_prompt: ""
  sampling:
    seed: 1234
    height: 480
    width: 832
    num_frames: 124
    fps: 24
    num_inference_steps: 9  # nine sigma points, eight DiT forwards
    guidance_scale: 1.0
    batch_cfg: false
  output:
    output_path: outputs/fasth3_spark_pair_qad_v2_nvfp4/
    save_video: true
    return_frames: false
