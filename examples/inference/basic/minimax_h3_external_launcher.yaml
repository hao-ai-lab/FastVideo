generator:
  model_path: MiniMaxAI/MiniMax-H3
  engine:
    num_gpus: 4
    execution_backend: external_launcher
    use_fsdp_inference: true
    parallelism:
      tp_size: 1
      sp_size: 4
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: true
      image_encoder: true
      vae: true
      pin_cpu_memory: false
request:
  prompt: A cinematic tracking shot of ocean waves at sunset
  negative_prompt: ""
  sampling:
    height: 768
    width: 1344
    num_frames: 124
    fps: 24
    num_inference_steps: 50
    guidance_scale: 1.0
    batch_cfg: false
    seed: 0
  output:
    output_path: outputs/minimax_h3_external_launcher.mp4
    save_video: true
    return_frames: false
