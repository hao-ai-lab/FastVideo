# CompactH3 (42-block 20B NVFP4) on one RTX PRO 6000 Blackwell (sm_120, 96 GB).
# Packed NVFP4 DiT + NVFP4 encoder + Comfy int8-convrot VAE. 96 GB holds the
# encoder, DiT, and VAE resident, so sequential ping-pong stays off.
#
# Assemble ./CompactH3 first (see the MiniMax H3 cookbook CompactH3 recipe).
# default_request.sampling is an example. Native 16:9 sizes include 832x480
# and 1344x768. Legal H3 frame counts are 17n+5, max 362 (15.08 s).
#
#   FASTVIDEO_ATTENTION_BACKEND=ATTN_QAT_INFER FASTVIDEO_VSA_SM100A=0 FASTVIDEO_FA4=0 \
#     FLASHINFER_CUDA_ARCH_LIST=12.0a \
#     fastvideo serve --config examples/serving/openai_compacth3_rtx_pro6000.yaml
generator:
  model_path: ./CompactH3
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    quantization:
      transformer_quant: NVFP4
      layer_profile: h3_dit
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: false
      image_encoder: true
      vae: false
      pin_cpu_memory: true
      lazy_module_load: false
    compile:
      enabled: false
      vae_enabled: false
  pipeline:
    workload_type: t2v
    experimental:
      attention_backend: ATTN_QAT_INFER
      h3_sequential_load: false
      inference_torch_compile: false
      vae_parallel_decode: false
      video_decode_backend: h3-vae

server:
  host: 127.0.0.1
  port: 8000
  output_dir: outputs/openai_compacth3_rtx_pro6000
  served_model_name: compacth3

default_request:
  negative_prompt: ""
  sampling:
    height: 768
    width: 1344
    num_frames: 124
    fps: 24
    num_inference_steps: 5
    guidance_scale: 1.0
    batch_cfg: false
    seed: 2026
  output:
    return_frames: false
