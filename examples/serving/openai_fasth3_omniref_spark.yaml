# OpenAI-compatible FastH3 OmniRef (Ref2VA) server on one DGX Spark (GB10, 128 GB unified).
#
# Serving adaptation of examples/inference/basic/basic_fasth3_omniref_spark.yaml; the same NVFP4 stack and
# device policy, not yet GPU-validated as a server.
#
# Point model_path at a composed OmniRef directory. Build it once with
#   python examples/inference/basic/basic_fasth3_omniref_pdd.py \
#     --model-path FastVideo/FastH3-OmniRef-NVFP4-QAD --profile spark \
#     --composed-dir ./FastH3-OmniRef-Composed --image assets/images/couple.jpg --prompt "..."
#
# Requests carry ordered references: image_reference / input_reference for images,
# video_reference for clips. Local paths must sit under server.media_roots.
#
# FASTVIDEO_ATTENTION_BACKEND=VIDEO_SPARSE_ATTN_H3 \
# FASTVIDEO_H3_VSA_FP4=1 FASTVIDEO_H3_VSA_FP4_PREFIX=fp8 \
# FASTVIDEO_H3_VSA_FP4_TWO_LEVEL_P=1 FASTVIDEO_H3_VSA_FP4_K_SMOOTH=1 \
# FASTVIDEO_H3_GATE_CHUNK_ROWS=8192 \
# FASTVIDEO_ULYSSES_A2A=auto FASTVIDEO_MINIMAX_H3_EXACT_KERNELS=all \
# FASTVIDEO_H3_VSA_HEADS_FIRST_TILE=1 FASTVIDEO_H3_VAE_TILE_PARALLEL=1 \
# FASTVIDEO_H3_REF2VA_MEMO_ENTRIES=16 \
# FASTVIDEO_MINIMAX_H3_FUSIONS=all \
# FASTVIDEO_VSA_TRITON=1 FASTVIDEO_VSA_PTX_BLACKWELL=0 FASTVIDEO_FA4=0 \
# FASTVIDEO_NVFP4_MM_BACKEND=cudnn FASTVIDEO_NVFP4_MM_ROW_SPLIT=table \
# FASTVIDEO_H3_VAE_TILE_BATCH=12 FASTVIDEO_H3_VAE_INT8_OVERLAY=0 \
# fastvideo serve --config examples/serving/openai_fasth3_omniref_spark.yaml
#
# See docs/inference/fasth3_omniref.md.
generator:
  model_path: ./FastH3-OmniRef-Composed
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    quantization:
      transformer_quant: NVFP4
      layer_profile: h3_dit_vsa
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: false
      image_encoder: false
      vae: false
      pin_cpu_memory: false
      lazy_module_load: false
  pipeline:
    workload_type: i2v
    components:
      override_pipeline_cls_name: MiniMaxH3Ref2VAModularPipeline
    experimental:
      attention_backend: VIDEO_SPARSE_ATTN_H3
      h3_vsa_fp4:
        enabled: true
        prefix_precision: fp8
        two_level_p: true
        smooth_k: true
      video_decode_backend: h3-vae
      h3_sequential_load: false

server:
  host: 0.0.0.0
  port: 8000
  output_dir: outputs/openai_fasth3_omniref_spark
  served_model_name: fasth3-omniref

default_request:
  negative_prompt: ""
  sampling:
    height: 480
    width: 832
    num_frames: 124
    fps: 24
    num_inference_steps: 8  # eight fused PDD blocks; the contract sets it
    guidance_scale: 1.0
    batch_cfg: false
    seed: 1234
  output:
    return_frames: false
