# OpenAI-compatible server for HunyuanVideo 1.5 T2V at 480p.
#   fastvideo serve --config examples/serving/openai_hunyuan15_t2v_480p.yaml
generator:
  model_path: hunyuanvideo-community/HunyuanVideo-1.5-Diffusers-480p_t2v
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: true
      vae: true
      text_encoder: true
      pin_cpu_memory: true
  pipeline:
    workload_type: t2v

server:
  host: 0.0.0.0
  port: 8000
  output_dir: outputs/openai_hunyuan15_t2v_480p
  served_model_name: hunyuan15-t2v-480p

default_request:
  negative_prompt: ""
  sampling:
    height: 480
    width: 848
    num_frames: 121
    fps: 24
    num_inference_steps: 50
    guidance_scale: 6.0
  output:
    return_frames: false
