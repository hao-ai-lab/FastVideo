# OpenAI-compatible server for Kandinsky 6 Pro-distill TI2VA (pi-Flow, 10 steps).
#   fastvideo serve --config examples/serving/openai_kandinsky6_ti2va_distilled.yaml
# Omit image_reference for text-to-video; send it for image conditioning.
generator:
  model_path: kandinskylab/Kandinsky-6.0-Pro-distill-5s-Diffusers
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      vae: false
      text_encoder: true
      pin_cpu_memory: true
  pipeline:
    workload_type: t2v

server:
  host: 0.0.0.0
  port: 8000
  output_dir: outputs/openai_kandinsky6_ti2va_distilled
  served_model_name: kandinsky6-ti2va-distilled

default_request:
  sampling:
    height: 512
    width: 768
    num_frames: 121
    fps: 24
    num_inference_steps: 10
    guidance_scale: 1.0
  output:
    return_frames: false
