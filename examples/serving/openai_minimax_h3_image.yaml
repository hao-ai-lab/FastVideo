# OpenAI-compatible MiniMax-H3-Image server.
# Text-to-image: POST /v1/images/generations
# Reference edit: POST /v1/images/edits
# The checkpoint only accepts 6 steps and guidance_scale 1.
generator:
  model_path: MiniMaxAI/MiniMax-H3-Image
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: true
      image_encoder: true
      vae: true
      pin_cpu_memory: true
  pipeline:
    workload_type: t2i
server:
  host: 0.0.0.0
  port: 8000
  output_dir: outputs/openai_minimax_h3_image
  served_model_name: minimax-h3-image
default_request:
  negative_prompt: ""
  sampling:
    height: 2048
    width: 2048
    num_frames: 1
    fps: 1
    num_inference_steps: 6
    guidance_scale: 1.0
    seed: 0
