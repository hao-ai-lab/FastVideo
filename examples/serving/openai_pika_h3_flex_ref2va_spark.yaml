# OpenAI-compatible Pika H3 Flex Ref2VA server on one DGX Spark (GB10, 128 GB unified memory).
#
# Pika H3 Flex loads one released adapter per server. This one serves `ref2va`: requests carry ordered
# image_reference / video_reference / audio_reference media (at least one image or video). Serve
# openai_pika_h3_flex_fl2va_spark.yaml for t2va, i2va and fl2va.
# Both tiers (480p, 768p) and 5-15 s clips are accepted; GET /v1/model_info lists them.
#
# FASTVIDEO_MINIMAX_H3_EXACT_KERNELS=all FASTVIDEO_H3_VAE_TILE_PARALLEL=1 \
# fastvideo serve --config examples/serving/openai_pika_h3_flex_ref2va_spark.yaml
#
# See docs/inference/pika_h3_flex.md.
generator:
  model_path: FastVideo/Pika-H3-Flex-NVFP4-QAD
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    quantization:
      transformer_quant: NVFP4
      layer_profile: h3_dit
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: false
      image_encoder: false
      vae: false
      pin_cpu_memory: false
      lazy_module_load: false
  pipeline:
    workload_type: i2v
    vae_tiling: true
    components:
      override_pipeline_cls_name: PikaH3FlexRef2VAModularPipeline

server:
  host: 0.0.0.0
  port: 8000
  output_dir: outputs/openai_pika_h3_flex_ref2va_spark
  served_model_name: pika-h3-flex-ref2va

default_request:
  negative_prompt: ""
  sampling:
    height: 768
    width: 1344
    num_frames: 124
    fps: 24
    num_inference_steps: 6
    guidance_scale: 1.0
    batch_cfg: false
    seed: 0
  output:
    return_frames: false
