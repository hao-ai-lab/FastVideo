# 32x GB200 (8 trays x 4 GPUs) data-free DMD2 on MiniMax H3, all-dense FA4.
#
# Topology: sp_size=4 within a tray (one packed document per SP group), HSDP
# mesh (replicate=8, shard=4) — params sharded only inside a tray (keeps the
# proven ~145 GiB/rank profile from the 4-GPU runs), gradients replicated
# across trays. 32/4 = 8 data-parallel groups.
#
# Global batch 64 = 8 DP groups x gradient_accumulation_steps 8 x micro-batch
# 1. H3's packed-sequence pipeline is batch-1 per forward by design (one
# interleaved [text|cond|audio|video] document); batching composes through
# accumulation, which the trainer loops natively.
#
# Launch: sbatch examples/train/slurm/dmd2_32xgb200.sbatch
#
# NOTE: data_path below still points at the 2-row overfit set — good for a
# 32-GPU smoke test only. Swap in the real preprocessed t2va dataset before a
# production run.

models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/models/MiniMax-H3
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: FLASH_ATTN
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/models/MiniMax-H3
    trainable: false
    disable_custom_init_weights: true
    attention_backend: FLASH_ATTN
  critic:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/models/MiniMax-H3
    trainable: true
    disable_custom_init_weights: true
    enable_gradient_checkpointing_type: full
    attention_backend: FLASH_ATTN

method:
  _target_: fastvideo.train.methods.distribution_matching.dmd2.DMD2Method
  rollout_mode: simulate
  generator_update_interval: 5
  real_score_guidance_scale: 3.5
  dmd_denoising_steps: [1000, 757, 522]
  min_timestep_ratio: 0.02
  max_timestep_ratio: 0.98
  cfg_uncond:
    text: zero

  fake_score_learning_rate: 8.0e-6
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 32
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 8
    hsdp_shard_dim: 4

  data:
    data_path: /mnt/h3-dmd2-overfit/data_bs2  # smoke-test set; swap for real data
    preprocessed_data_type: t2va
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 37
    num_height: 768
    num_width: 1344
    num_frames: 124

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 4000
    # 8 accumulation rounds x 8 DP groups = global batch 64 per optimizer step.
    gradient_accumulation_steps: 8

  checkpoint:
    output_dir: outputs/minimax_h3_dmd2_simulate_fa4_32gpu
    # Multi-node runs should checkpoint; DCP saves are large — point
    # output_dir at a volume with headroom or set back to 0 to disable.
    training_state_checkpointing_steps: 500
    checkpoints_total_limit: 3

  tracker:
    project_name: h3-dmd2-vsa
    run_name: dmd2_simulate_fa4_32gpu

  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  validation:
    _target_: fastvideo.train.callbacks.validation.ValidationCallback
    pipeline_target: fastvideo.pipelines.basic.minimax_h3.minimax_h3_pipeline.MiniMaxH3Pipeline
    dataset_file: /mnt/h3-dmd2-overfit/c17_bs2_validation.json
    every_steps: 250
    run_at_start: true
    sampling_steps: [3]
    guidance_scale: 1.0
    num_frames: 124
    num_videos_per_prompt: 1
    use_validation_media_conditioning: false
    offload_training_state: true
    text_encoder_cpu_offload: true
    vae_cpu_offload: true

pipeline: {}
