# 32x GB200 (8 trays x 4 GPUs) data-free DMD2 on MiniMax H3 over the VidProM
# prompt set — the production variant of dmd2_simulate_fa4_32gpu.yaml.
#
# Identical validated topology and hyperparameters; only the data source and
# cluster paths differ:
#   - training data: 63,136 text-only conditioning rows (VidProM-H3-T2VA
#     prompts encoded by preprocess_minimax_h3_text_only.py — Qwen3-VL
#     layer-50, fp32) instead of the 2-row t2va smoke set. Latents are never
#     read in simulate mode; text_only rows carry exactly what the run uses.
#   - paths point at /mnt/lustre (nvl-gb200 cluster layout).
#
# Launch: REPO=/mnt/lustre/vlm-wlsaidhi/fastvideo/FastVideo \
#         CONFIG=<this file> sbatch examples/train/slurm/dmd2_32xgb200.sbatch

models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/lustre/vlm-k1kong/models/MiniMax-H3
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: FLASH_ATTN
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/lustre/vlm-k1kong/models/MiniMax-H3
    trainable: false
    disable_custom_init_weights: true
    attention_backend: FLASH_ATTN
  critic:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/lustre/vlm-k1kong/models/MiniMax-H3
    trainable: true
    disable_custom_init_weights: true
    enable_gradient_checkpointing_type: full
    attention_backend: FLASH_ATTN

method:
  _target_: fastvideo.train.methods.distribution_matching.dmd2.DMD2Method
  rollout_mode: simulate
  generator_update_interval: 5
  real_score_guidance_scale: 3.5
  dmd_denoising_steps: [1000, 757, 522]
  min_timestep_ratio: 0.02
  max_timestep_ratio: 0.98
  cfg_uncond:
    text: zero

  fake_score_learning_rate: 8.0e-6
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 32
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 8
    hsdp_shard_dim: 4

  data:
    data_path: /mnt/lustre/vlm-wlsaidhi/fastvideo/data/vidprom_h3_text_only
    preprocessed_data_type: text_only
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 37
    num_height: 768
    num_width: 1344
    num_frames: 124

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 4000
    # 8 accumulation rounds x 8 DP groups = global batch 64 per optimizer step.
    gradient_accumulation_steps: 8

  checkpoint:
    output_dir: /mnt/lustre/vlm-wlsaidhi/fastvideo/outputs/minimax_h3_dmd2_simulate_fa4_32gpu_vidprom
    # DCP saves are ~120 GiB+ per checkpoint for the two trainable roles;
    # lustre is the only shared volume with that headroom (monitor `df`).
    training_state_checkpointing_steps: 500
    checkpoints_total_limit: 3

  tracker:
    project_name: h3-dmd2-vsa
    run_name: dmd2_simulate_fa4_32gpu_vidprom

  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  validation:
    _target_: fastvideo.train.callbacks.validation.ValidationCallback
    pipeline_target: fastvideo.pipelines.basic.minimax_h3.minimax_h3_pipeline.MiniMaxH3Pipeline
    # 64 held-out prompts (Wan2.1 DMD2 validation_64 rewritten into H3's
    # three-field document format per MiniMax's prompt guide; verified
    # disjoint from the VidProM training captions). 8 DP groups render 8
    # videos each per pass. Repo copy: validation_wan64_h3.json next to
    # this config.
    dataset_file: /mnt/lustre/vlm-wlsaidhi/fastvideo/data/h3_validation_wan64.json
    every_steps: 100
    run_at_start: true
    sampling_steps: [3]
    guidance_scale: 1.0
    num_frames: 124
    num_videos_per_prompt: 1
    use_validation_media_conditioning: false
    offload_training_state: true
    text_encoder_cpu_offload: true
    vae_cpu_offload: true

pipeline: {}
