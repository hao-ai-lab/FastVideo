# Single-sample DMD2 DATA-FREE overfit: rollout_mode=simulate on MiniMax H3
# with FLASH_ATTN (FA4) for every role — no VSA in the loop.
#
# - simulate rollout: the student builds its own trajectory from pure noise
#   through dmd_denoising_steps (no-grad prefix steps, one with-grad step at a
#   sampled target index). VAE latents in the parquet are ignored (zeros
#   latents sized from training.data dims); only the text conditioning is
#   consumed.
# - Student/teacher/critic: FLASH_ATTN (run with FASTVIDEO_FA4=1). DMD2 still
#   passes attn_kind="vsa" for the student rollout, which degrades to dense
#   because attn_metadata_vsa stays None for non-VSA backends.
# - Data: same ONE preprocessed t2va parquet row (768x1344, 124 frames @ 24
#   fps) as dmd2_vsa0_overfit.yaml; see examples/distill/MiniMax-H3/.

models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/models/MiniMax-H3
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: FLASH_ATTN
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/models/MiniMax-H3
    trainable: false
    disable_custom_init_weights: true
    attention_backend: FLASH_ATTN
  critic:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/models/MiniMax-H3
    trainable: true
    disable_custom_init_weights: true
    enable_gradient_checkpointing_type: full
    attention_backend: FLASH_ATTN

method:
  _target_: fastvideo.train.methods.distribution_matching.dmd2.DMD2Method
  rollout_mode: simulate
  generator_update_interval: 5
  real_score_guidance_scale: 3.5
  dmd_denoising_steps: [1000, 757, 522]
  min_timestep_ratio: 0.02
  max_timestep_ratio: 0.98
  # H3 has no negative-prompt encoder at training time; unconditional teacher
  # forwards zero the text embeddings instead.
  cfg_uncond:
    text: zero

  # Critic optimizer (required — no fallback to training.optimizer)
  fake_score_learning_rate: 8.0e-6
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 4
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4

  data:
    # Preprocessed-latents parquet dir; simulate mode only reads the text
    # conditioning from it (latents are zeros sized from the dims below).
    data_path: /mnt/h3-dmd2-overfit/data
    preprocessed_data_type: t2va
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 37
    num_height: 768
    num_width: 1344
    num_frames: 124

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 2000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/minimax_h3_dmd2_simulate_fa4_overfit
    # 0 disables training-state checkpointing (no resume; avoids ~400+ GiB
    # DCP saves on the 87%-full volume).
    training_state_checkpointing_steps: 0
    checkpoints_total_limit: 3

  tracker:
    project_name: h3-dmd2-vsa
    run_name: dmd2_simulate_fa4_overfit

  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  validation:
    _target_: fastvideo.train.callbacks.validation.ValidationCallback
    pipeline_target: fastvideo.pipelines.basic.minimax_h3.minimax_h3_pipeline.MiniMaxH3Pipeline
    dataset_file: /mnt/h3-dmd2-overfit/c17_validation.json
    every_steps: 50
    # Sample the untrained baseline at step 0 (costs the validation pipeline
    # build upfront: text-encoder + VAE loads before the first train step).
    run_at_start: true
    sampling_steps: [3]
    guidance_scale: 1.0
    num_frames: 124
    num_videos_per_prompt: 1
    use_validation_media_conditioning: false
    offload_training_state: true
    text_encoder_cpu_offload: true
    vae_cpu_offload: true
  # EMA disabled: its GPU shadow costs ~15.4 GiB/rank (OOM on 184 GiB cards).
  # ema:
  #   _target_: fastvideo.train.callbacks.ema.EMACallback
  #   decay: 0.98
  #   start_iter: 0

pipeline: {}
