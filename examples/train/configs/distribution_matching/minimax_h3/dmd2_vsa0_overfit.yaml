# Single-sample DMD2 overfit: MiniMax H3 with the VSA-H3 student backend at
# sparsity 0.0 (parity-vs-dense experiment; the backend's sparsity-0 path is
# parity-proven <=2e-4 vs dense).
#
# - Student:  VIDEO_SPARSE_ATTN_H3 backend; DMD2 forwards it attn_kind="vsa"
#   with real packed-sequence metadata built in MiniMaxH3DMDModel.prepare_batch.
# - Teacher/critic: FLASH_ATTN (run with FASTVIDEO_FA4=1 for the FA4 path);
#   their forwards stay dense (attn_metadata=None).
# - Data: ONE preprocessed t2va parquet row (768x1344, 124 frames @ 24 fps)
#   produced by fastvideo/pipelines/preprocess/preprocess_minimax_h3_overfit.py
#   — see examples/distill/MiniMax-H3/overfit_vsa0.sh.

models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: MiniMaxAI/MiniMax-H3
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: VIDEO_SPARSE_ATTN_H3
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: MiniMaxAI/MiniMax-H3
    trainable: false
    disable_custom_init_weights: true
    attention_backend: FLASH_ATTN
  critic:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: MiniMaxAI/MiniMax-H3
    trainable: true
    disable_custom_init_weights: true
    enable_gradient_checkpointing_type: full
    attention_backend: FLASH_ATTN

method:
  _target_: fastvideo.train.methods.distribution_matching.dmd2.DMD2Method
  rollout_mode: data_latent
  generator_update_interval: 5
  real_score_guidance_scale: 3.5
  dmd_denoising_steps: [1000, 757, 522]
  min_timestep_ratio: 0.02
  max_timestep_ratio: 0.98
  # H3 has no negative-prompt encoder at training time; unconditional teacher
  # forwards zero the text embeddings instead.
  cfg_uncond:
    text: zero

  # Critic optimizer (required — no fallback to training.optimizer)
  fake_score_learning_rate: 8.0e-6
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 4
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4

  data:
    # Preprocessed-latents parquet dir; the cluster run produces it.
    data_path: /mnt/h3-dmd2-overfit/data
    preprocessed_data_type: t2va
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 37
    num_height: 768
    num_width: 1344
    num_frames: 124

  # Student VSA sparsity (0.0 = every tile selected, dense parity).
  vsa:
    sparsity: 0.0

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 2000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/minimax_h3_dmd2_vsa0_overfit
    training_state_checkpointing_steps: 250
    checkpoints_total_limit: 3

  tracker:
    project_name: h3-dmd2-vsa
    run_name: dmd2_vsa0_overfit

  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  validation:
    _target_: fastvideo.train.callbacks.validation.ValidationCallback
    pipeline_target: fastvideo.pipelines.basic.minimax_h3.minimax_h3_pipeline.MiniMaxH3Pipeline
    dataset_file: examples/training/finetune/Wan2.1-Fun-1.3B-InP/crush_smol/validation.json
    every_steps: 250
    sampling_steps: [3]
    guidance_scale: 1.0
    num_frames: 124
    num_videos_per_prompt: 1
    use_validation_media_conditioning: false
    offload_training_state: true
    text_encoder_cpu_offload: true
    vae_cpu_offload: true
  ema:
    _target_: fastvideo.train.callbacks.ema.EMACallback
    decay: 0.98
    start_iter: 0

pipeline: {}
