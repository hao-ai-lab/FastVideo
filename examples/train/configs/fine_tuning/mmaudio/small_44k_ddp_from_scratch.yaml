# Official MMAudio small_44k training with one full DDP replica per GPU.
# This is independent from the existing FSDP/HSDP scratch config.

models:
  student:
    _target_: fastvideo.train.models.mmaudio.MMAudioModel
    variant: small_44k
    from_scratch: true
    empty_string_features_path: ""
    latent_statistics_path: ""
    latent_statistics_chunk_size: 32
    trainable: true

method:
  _target_: fastvideo.train.methods.fine_tuning.flow_matching.FlowMatchingFineTuneMethod

training:
  model_path: converted_weights/mmaudio/small_44k
  distributed:
    strategy: ddp
    num_gpus: 4
    sp_size: 1
    tp_size: 1
    # DDP replicates the full model and does not use HSDP meshes.
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 1
    pin_cpu_memory: false

  data:
    data_path: ""
    preprocessed_data_type: mmaudio_features
    dataloader_num_workers: 0
    train_batch_size: 128
    training_cfg_rate: 0.1
    seed: 14159265

  optimizer:
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    eps: 1.0e-6
    weight_decay: 1.0e-6
    lr_scheduler: multistep_with_warmup
    lr_warmup_steps: 1000
    lr_milestones: [240000, 270000]
    lr_gamma: 0.1
    # Matches the upstream Runner's AdamW(..., fused=True).
    fused: true

  loop:
    max_train_steps: 300000
    # 4 GPUs x 128 samples/GPU = official effective global batch 512.
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/mmaudio_small_44k_ddp_from_scratch
    # Keep this divisible by the 5,000-step PostHocEMA interval so resume
    # always has an exactly aligned pair of official EMA snapshots.
    training_state_checkpointing_steps: 10000
    checkpoints_total_limit: 3
    resume_from_checkpoint: ""

  tracker:
    project_name: fastvideo_mmaudio
    run_name: mmaudio_small_44k_ddp_from_scratch

  model:
    logit_mean: 0.0
    logit_std: 1.0
    precondition_outputs: false
    # Matches official MMAudio's torch.compile(self.train_fn). Set false to
    # use eager execution when debugging or on an unsupported compiler stack.
    compile_train_fn: true
    torch_compile_kwargs:
      fullgraph: true

  # Official MMAudio uses FP32 master weights with BF16 autocast forward.
  dit_precision: fp32

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  posthoc_ema:
    _target_: fastvideo.train.callbacks.ddp_posthoc_ema.DDPPostHocEMACallback
    sigma_rels: [0.05, 0.1]
    update_every: 1
    checkpoint_every: 5000
    start_iter: 0
    default_output_sigma: 0.05
    step_size_correction: true
  validation:
    _target_: fastvideo.train.callbacks.mmaudio_validation.MMAudioValidationCallback
    data_path: ""
    every_steps: 5000
    max_batches: 0
    batch_size: 8
    num_data_workers: 0
    run_at_start: false
    # Official periodic validation samples the online model; EMA is
    # synthesized after training.
    use_ema: false
    inference_every_steps: 20000
    inference_model_path: converted_weights/mmaudio/large_44k_v2
    inference_num_samples: 16
    inference_num_steps: 25
    inference_guidance_scale: 4.5
    inference_save_video: true
    inference_log_to_tracker: true
