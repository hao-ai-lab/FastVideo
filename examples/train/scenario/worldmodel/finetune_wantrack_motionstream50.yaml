models:
  student:
    _target_: fastvideo.train.models.wantrack.wantrack.WanTrackModel
    init_from: /home/hal-kevin/models/trackwan_1.3b_i2v_control_init
    trainable: true

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  model_path: /home/hal-kevin/models/trackwan_1.3b_i2v_control_init

  distributed:
    num_gpus: 4
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 4
    hsdp_shard_dim: 1

  data:
    data_path: /home/hal-kevin/data/motion-stream-test/preprocessed_i2v_track/combined_parquet_dataset
    dataloader_num_workers: 2
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 31
    num_height: 480
    num_width: 832
    num_frames: 121

  optimizer:
    learning_rate: 1.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 3000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: /home/hal-kevin/data/motion-stream-test/wantrack_motionstream50_out
    training_state_checkpointing_steps: 500
    checkpoints_total_limit: 3
    resume_from_checkpoint: latest

  tracker:
    trackers: [wandb]
    project_name: wantrack-bidir
    run_name: motionstream50
    entity: s4duan-uc-san-diego

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  track_validation:
    _target_: fastvideo.train.callbacks.track_validation.TrackValidationCallback
    every_steps: 200
    num_val_samples: 3
    val_sample_indices: [28, 38, 47]
    num_inference_steps: 30
    guidance_scale: 3.0
    motion_guidance_scale: 1.5
    fps: 24
    grid_stride: 3
    tail: 12
    heldout_data_path: /home/hal-kevin/data/motion-stream-val/preprocessed_i2v_track/combined_parquet_dataset
    heldout_sample_indices: [0, 2, 8, 10, 12, 18]
    validate_at_start: false
    seed: 1000

pipeline:
  flow_shift: 3
