# STEP D — MotionStream stage-1 teacher training on the full OpenVid-1M bidir set, Wan2.1-14B.
#
# Direct 14B analog of finetune_wantrack_openvid_sparse_1p3b_merged_bias.yaml (wandb run
# openvid_bidir_1p3b_merged_bias). Hparams are copied EXACTLY from that run — lr 1e-5,
# global bs 128, 4800 steps, 480x832, 121f, 24fps, flow_shift 6, bf16 DiT — the only changes
# are the ones 14B geometry forces (hsdp dims, grad_accum to keep bs 128 at 32 GPUs).
#
# init_from is the step-C MERGED init: a fresh 14B base whose track_encoder AND
# patch_embedding.weight[:, 36:] both come from the 14B-native overfit (steps A+B), so the two
# are co-adapted. This is the whole point of the pipeline: gradient-SNR analysis showed a
# random 14B init gives per-sample track_encoder.proj grad ~0.011 (the same regime that made
# 1.3B-random FAIL), while 1.3B-merged sat at ~0.502 and succeeded.
#
# Launch with WANTRACK_FREEZE_HEAD=0 (track_encoder TRAINABLE) + TRACKWAN_TRACK_BIAS=1.
#
# CORRECTED 2026-07-31 — this header previously said FREEZE_HEAD=1, which contradicted the
# 1.3B run it claims to copy exactly:
#   * run_openvid_bidir_held.sh (the 1.3B stage-1 launcher) never sets WANTRACK_FREEZE_HEAD,
#     and wantrack.py defaults it to "0" -> the head was TRAINABLE.
#   * the three 1.3B run logs (openvid_bidir_1p3b_merged_bias_hold_{507,511,513}.out) contain
#     ZERO "FROZE track_encoder" lines, confirming it.
#   * every real freeze in this repo is stage-2/3: run_openvid_stage2*_slurm.sh and
#     run_openvid_stage3_slurm.sh ("head is converged" — converged BECAUSE stage-1 trained it).
#   * wantrack.py:78 itself calls it a "MotionStream stage-2 knob ... after initial training";
#     stage-1 bidir finetuning IS the initial training.
#   * that same comment notes the head only plateaus by step ~4700 of this 4800-step stage,
#     so freezing at step 0 removes essentially the whole trajectory, not a redundant tail.
#   * no 14B stage-1 run had ever been launched, so FREEZE_HEAD=1 here was untested.
# (The wantrack.py comment attributes "The track head remains frozen after initial training as
# it already operates chunk-wise" to 2511.01266; that sentence is not in the paper — its
# "chunk-wise" usages refer to KV-cache chunking.)
#
# 16 nodes x 4 GPU = 64 GPUs; grad_accum 2 -> 1 * 2 * 64 = 128 global.
models:
  student:
    _target_: fastvideo.train.models.wantrack.wantrack.WanTrackModel
    init_from: /mnt/lustre/vlm-s4duan/models/trackwan_14b_i2v_d64_merged_from_bs16_1200_bias
    trainable: true

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  model_path: /mnt/lustre/vlm-s4duan/models/trackwan_14b_i2v_d64_merged_from_bs16_1200_bias
  dit_precision: bf16

  distributed:
    num_gpus: 64          # 16 nodes x 4
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 16 # replicate across 16 nodes
    hsdp_shard_dim: 4     # shard 14B within each node (16x4=64)

  data:
    data_path: /mnt/lustre/vlm-s4duan/openvid_1m/combined_parquet_dataset
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 31
    num_height: 480
    num_width: 832
    num_frames: 121

  optimizer:
    learning_rate: 1.0e-5     # MotionStream teacher stage-1
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 4800
    gradient_accumulation_steps: 2   # 64 gpu x 1 x 2 = 128 global

  checkpoint:
    output_dir: /mnt/lustre/vlm-s4duan/openvid_bidir_14b_stage1_bs16merge_out
    training_state_checkpointing_steps: 100   # ~backstop vs the ~80min cordon cycle
    checkpoints_total_limit: 3
    resume_from_checkpoint: latest

  tracker:
    trackers: [wandb]
    project_name: wantrack-bidir
    run_name: openvid-bidir-14b-stage1-bs16merge

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  track_validation:
    _target_: fastvideo.train.callbacks.track_validation.TrackValidationCallback
    every_steps: 250
    num_val_samples: 4
    val_data_path: /mnt/lustre/vlm-s4duan/val_examples_mixed/combined_parquet_dataset   # 2 openvid + car + dog
    num_inference_steps: 30
    guidance_scale: 3.0
    motion_guidance_scale: 1.5
    fps: 24
    grid_stride: 3
    tail: 12
    validate_at_start: true
    seed: 1000

pipeline:
  # PROVENANCE of flow_shift 6 (traced 2026-07-31, it is NOT inherited from anywhere):
  #   - NOT a Wan default: Wan2.1-I2V-14B-720P's own scheduler_config.json says 5.0, the
  #     Fun-1.3B-InP says 3.0 — and this model's init checkpoint declares 5.0.
  #   - NOT from MotionStream: the paper (2511.01266) specifies no shift value at all, and
  #     trained Wan2.1-1.3B @832x480 / Wan2.2-5B @1280x704.
  #   - NOT from matrixgame: matrixgame2.py / matrixgame3.py both default to 5.0.
  #   - FastVideo's own causal recipe uses 5: step1_kd.yaml's t_list [995,937,833,625] is the
  #     shift-5 warp of the Self-Forcing grid [1000,750,500,250].
  #   It was set by hand in ac919b1c (2026-07-14) with the first openvid config, then copied.
  # KEEP IT ANYWAY: the downstream stack is calibrated to it — the CD/SF/KD student schedule
  # t_list [1000, 947, 857, 667] IS the shift-6 warp of [1000,750,500,250] (see
  # ablation/wantrack_causal_joint/kd_ode_init.yaml), so moving the teacher to 5 would desync
  # teacher and student. The stake is small either way: shift scales SNR by exactly 1/shift^2
  # at EVERY timestep, so 5->6 is a uniform 1.58 dB log-SNR translation, against the 4.44 dB
  # Wan itself applies between 480P (3) and 720P (5).
  flow_shift: 6
