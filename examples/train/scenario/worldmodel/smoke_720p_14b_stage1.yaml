# SMOKE TEST for 720p stage-1 — NOT a training run.
#
# Purpose: before committing 4800 steps x 16 nodes, verify that the EXACT stage-1 geometry
# (14B, hsdp_replicate_dim 16 x hsdp_shard_dim 4 = 64 GPUs, full gradient checkpointing,
# global bs 128) still fits and how fast it runs when the token count goes
#   480p: 30x52 x31t =  48,360 tokens
#   720p: 45x80 x31t = 111,600 tokens   (2.31x, ~5.3x attention FLOPs)
#
# Identical to finetune_wantrack_openvid_sparse_14b_stage1_16node.yaml EXCEPT:
#   - data_path -> the new 720p parquet, num_height/num_width -> 720/1280
#   - 20 steps instead of 4800
#   - no checkpoint writing (a 14B DCP save would dominate the runtime)
#   - no wandb, no validation (isolates TRAINING memory; validation is a separate check)
# flow_shift stays 6: the whole downstream CD/SF/KD stack derives its 4-step student schedule
# [1000, 947, 857, 667] from shift 6, so teacher and student must agree. 5 vs 6 is only a
# 1.58 dB uniform log-SNR translation (SNR scales as 1/shift^2), far smaller than the 2.31x
# token change we are actually testing.
models:
  student:
    _target_: fastvideo.train.models.wantrack.wantrack.WanTrackModel
    init_from: /mnt/lustre/vlm-s4duan/models/trackwan_14b_i2v_d64_merged_from_bs16_1200_bias
    trainable: true

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  model_path: /mnt/lustre/vlm-s4duan/models/trackwan_14b_i2v_d64_merged_from_bs16_1200_bias
  dit_precision: bf16

  distributed:
    num_gpus: 64
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 16
    hsdp_shard_dim: 4

  data:
    data_path: /mnt/lustre/vlm-s4duan/openvid_1m/combined_parquet_dataset_720p
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 31
    num_height: 720
    num_width: 1280
    num_frames: 121

  optimizer:
    learning_rate: 1.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 20
    gradient_accumulation_steps: 2   # keep production value: same micro-batch => same peak memory

  checkpoint:
    output_dir: /mnt/lustre/vlm-s4duan/smoke_720p_14b_out
    training_state_checkpointing_steps: 0   # never save
    checkpoints_total_limit: 0
    resume_from_checkpoint: ""              # always start fresh

  tracker:
    trackers: []                            # no wandb for a smoke test

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

pipeline:
  flow_shift: 6
