# Read by finetune_ode_init_16k_vidprom.slurm, which passes model_path, engine.num_gpus,
# engine.parallelism.hsdp_replicate_dim, training.data.data_path, training.checkpoint.output_dir,
# training.validation.dataset_file, and pipeline.components.transformer_weights on the command line.
engine:
  parallelism:
    tp_size: 1
    sp_size: 1
    hsdp_shard_dim: 1
  precision:
    dit: fp32
pipeline:
  components:
    override_transformer_cls_name: CausalWanTransformer3DModel
  dmd_denoising_steps: [1000, 750, 500, 250]
training:
  data:
    dataloader_num_workers: 1
    num_height: 480
    num_width: 832
    num_frames: 81
    train_batch_size: 1
    num_latent_t: 21
    training_cfg_rate: 0.1
    train_sp_batch_size: 1
  optimizer:
    learning_rate: 2.0e-06
    weight_decay: 0.0001
    max_grad_norm: 1.0
  loop:
    max_train_steps: 6001
    gradient_accumulation_steps: 1
  checkpoint:
    # resume_from_checkpoint: ode_init_diffusers/
    training_state_checkpointing_steps: 500
    weight_only_checkpointing_steps: 500
    checkpoints_total_limit: 3
  tracker:
    project_name: wan_ode_init
    run_name: vidprom_8b16k_ode_init_2e-6
  validation:
    enabled: true
    sampling_steps: [50]
    guidance_scale: 6.0
    every_steps: 50
    log_visualization: true
  distillation:
    warp_denoising_step: true
  ema:
    start_step: 0
  model:
    enable_gradient_checkpointing_type: full
