# Read by finetune_i2v.sh, which passes model_path, engine.num_gpus, training.data.data_path, and
# training.validation.dataset_file on the command line.
engine:
  parallelism:
    tp_size: 1
    sp_size: 2
    hsdp_replicate_dim: 4
    hsdp_shard_dim: 2
  precision:
    dit: fp32
training:
  data:
    dataloader_num_workers: 1
    num_height: 352
    num_width: 640
    num_frames: 77
    train_batch_size: 1
    num_latent_t: 20
    training_cfg_rate: 0.1
    train_sp_batch_size: 1
  optimizer:
    learning_rate: 2.0e-05
    weight_decay: 0.0001
    max_grad_norm: 1.0
  loop:
    max_train_steps: 1500
    gradient_accumulation_steps: 4
  checkpoint:
    output_dir: checkpoints/matrixgame2_finetune
    training_state_checkpointing_steps: 100
    weight_only_checkpointing_steps: 100
    checkpoints_total_limit: 3
  tracker:
    project_name: matrixgame2_finetune
  validation:
    enabled: true
    sampling_steps: [40]
    guidance_scale: 6.0
    every_steps: 100
  ema:
    start_step: 0
  model:
    enable_gradient_checkpointing_type: full
