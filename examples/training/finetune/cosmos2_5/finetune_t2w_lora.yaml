# Read by finetune_t2w_lora.sh, which passes model_path, engine.num_gpus, engine.parallelism.sp_size,
# engine.parallelism.tp_size, engine.parallelism.hsdp_shard_dim, training.data.data_path, and
# training.validation.dataset_file on the command line.
engine:
  parallelism:
    hsdp_replicate_dim: 1
  precision:
    dit: fp32
training:
  data:
    dataloader_num_workers: 1
    num_height: 704
    num_width: 1280
    num_frames: 77
    train_batch_size: 1
    num_latent_t: 20
    training_cfg_rate: 0.1
    train_sp_batch_size: 1
  optimizer:
    learning_rate: 0.0001
    weight_decay: 0.0001
    max_grad_norm: 1.0
  loop:
    max_train_steps: 5000
    gradient_accumulation_steps: 8
  checkpoint:
    output_dir: checkpoints/cosmos2_5_t2w_lora
    # resume_from_checkpoint: checkpoints/cosmos2_5_t2w_lora/checkpoint-1000
    training_state_checkpointing_steps: 500
    weight_only_checkpointing_steps: 500
    checkpoints_total_limit: 5
  tracker:
    project_name: cosmos2_5_t2w_lora
  validation:
    enabled: true
    sampling_steps: [35]
    guidance_scale: 7.0
    every_steps: 200
  ema:
    start_step: 0
  lora:
    enabled: true
    rank: 32
