# Read by finetune_t2v_lora.sh, which passes model_path, engine.num_gpus, engine.parallelism.sp_size,
# engine.parallelism.hsdp_shard_dim, training.data.data_path, and training.validation.dataset_file on the command line.
engine:
  parallelism:
    tp_size: 1
    hsdp_replicate_dim: 1
training:
  data:
    dataloader_num_workers: 1
    num_height: 480
    num_width: 832
    num_frames: 77
    train_batch_size: 1
    num_latent_t: 10
    train_sp_batch_size: 1
  optimizer:
    learning_rate: 0.0002
    weight_decay: 0.0001
    max_grad_norm: 1.0
  loop:
    max_train_steps: 2000
    gradient_accumulation_steps: 8
  checkpoint:
    output_dir: checkpoints/ltx2_t2v_lora_finetune
    training_state_checkpointing_steps: 1000
    weight_only_checkpointing_steps: 1000
    checkpoints_total_limit: 3
  tracker:
    project_name: ltx2_t2v_lora_finetune
  validation:
    enabled: true
    sampling_steps: [50]
    guidance_scale: 3.0
    every_steps: 200
  lora:
    enabled: true
    rank: 16
    alpha: 16
  model:
    enable_gradient_checkpointing_type: full
    ltx2_first_frame_conditioning_p: 0.1
