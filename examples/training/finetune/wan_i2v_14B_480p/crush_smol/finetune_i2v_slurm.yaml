# Read by finetune_i2v.slurm, which passes model_path, engine.num_gpus, engine.parallelism.sp_size,
# engine.parallelism.hsdp_replicate_dim, engine.parallelism.hsdp_shard_dim, training.data.data_path, and
# training.validation.dataset_file on the command line.
engine:
  parallelism:
    tp_size: 1
  precision:
    dit: fp32
training:
  data:
    dataloader_num_workers: 10
    num_height: 480
    num_width: 832
    num_frames: 77
    train_batch_size: 2
    num_latent_t: 8
    training_cfg_rate: 0.1
    train_sp_batch_size: 1
  optimizer:
    learning_rate: 1.0e-05
    weight_decay: 0.0001
    max_grad_norm: 1.0
  loop:
    max_train_steps: 2000
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: checkpoints/wan_i2v_finetune
    training_state_checkpointing_steps: 1000
    weight_only_checkpointing_steps: 1000
    checkpoints_total_limit: 3
  tracker:
    project_name: wan_i2v_finetune
  validation:
    enabled: true
    sampling_steps: [40]
    guidance_scale: 6.0
    every_steps: 100
  ema:
    start_step: 0
  model:
    enable_gradient_checkpointing_type: full
