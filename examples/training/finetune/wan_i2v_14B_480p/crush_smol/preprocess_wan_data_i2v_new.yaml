# Read by preprocess_wan_data_i2v_new.sh, which passes model_path, preprocess.dataset_path, and
# preprocess.dataset_output_dir.
mode: preprocess
pipeline:
  workload_type: i2v
preprocess:
  dataset_type: merged
  preprocess_video_batch_size: 2
  dataloader_num_workers: 0
  max_height: 480
  max_width: 832
  num_frames: 77
  train_fps: 16
  samples_per_file: 8
  flush_frequency: 8
  video_length_tolerance_range: 5
