# Read by finetune_qat.sh, which passes model_path, engine.num_gpus, engine.parallelism.sp_size,
# engine.parallelism.hsdp_shard_dim, training.data.data_path, training.loop.max_train_steps,
# training.validation.dataset_file, and training.validation.sampling_steps on the command line.
engine:
  parallelism:
    tp_size: 1
    hsdp_replicate_dim: 1
  precision:
    dit: fp32
pipeline:
  flow_shift: 1.0
training:
  data:
    dataloader_num_workers: 1
    num_height: 480
    num_width: 832
    num_frames: 77
    train_batch_size: 1
    num_latent_t: 20
    training_cfg_rate: 0.1
    train_sp_batch_size: 1
  optimizer:
    learning_rate: 1.0e-06
    weight_decay: 0.01
    max_grad_norm: 1.0
  loop:
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: checkpoints/wan_t2v_qat_finetune
    training_state_checkpointing_steps: 500
    weight_only_checkpointing_steps: 500
  tracker:
    project_name: wan_t2v_qat_finetune
  validation:
    enabled: true
    guidance_scale: 5.0
    every_steps: 50
  ema:
    start_step: 0
  model:
    enable_gradient_checkpointing_type: full
